<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23d97757' d='M12 2l1.8 7.2L21 7l-5.6 5 5.6 5-7.2-2.2L12 22l-1.8-7.2L3 17l5.6-5L3 7l7.2 2.2z'/></svg>">
<link id="hl-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link id="hl-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --bg: #faf9f5; --sidebar: #f5f4ed; --panel: #ffffff; --user: #f0eee6; --border: #e5e2d9; --border-strong: #d6d2c4;
  --text: #3d3929; --text-2: #73705f; --text-3: #a3a08f; --accent: #c96442; --accent-hover: #b5573a; --hover: #ebe9df;
  --code-bg: #f5f4ef; --danger: #b3261e; --ok: #3b7d4f; --shadow: 0 2px 12px rgba(60, 50, 30, .08);
  --serif: "Tiempos Text", "Source Serif 4", Georgia, "Noto Serif SC", "Songti SC", serif;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #262624; --sidebar: #1f1e1d; --panel: #30302e; --user: #141413; --border: #3a3936; --border-strong: #4a4945;
    --text: #e8e6dc; --text-2: #a8a597; --text-3: #75736a; --hover: #35342f; --code-bg: #1f1e1d; --shadow: 0 2px 12px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.app { display: flex; height: 100dvh; }

/* sidebar */
.sidebar { width: 272px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: margin .2s; }
.sidebar.collapsed { margin-left: -272px; }
.sb-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px; }
.logo { font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: -.01em; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.new-chat { margin: 6px 10px 10px; padding: 8px 10px; border-radius: 10px; display: flex; gap: 10px; align-items: center; font-weight: 500; }
.new-chat:hover { background: var(--hover); }
.new-chat .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 17px; }
.sb-label { padding: 10px 18px 6px; font-size: 12px; color: var(--text-3); font-weight: 500; }
.conv-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.conv { display: flex; align-items: center; border-radius: 8px; padding: 7px 10px; font-size: 14px; color: var(--text-2); cursor: pointer; gap: 6px; }
.conv:hover { background: var(--hover); color: var(--text); }
.conv.active { background: var(--hover); color: var(--text); }
.conv .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.conv .acts { display: none; gap: 2px; }
.conv-tip { position: fixed; z-index: 60; max-width: min(420px, calc(100vw - 16px)); background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 6px 10px; font-size: 13px; line-height: 1.45; word-break: break-word; pointer-events: none; }
.conv:hover .acts { display: flex; }
.conv .acts button { padding: 2px 5px; border-radius: 5px; color: var(--text-3); font-size: 12px; }
.conv .acts button:hover { color: var(--text); background: var(--border); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; flex-shrink: 0; }
@keyframes pulse { 50% { opacity: .3; } }
.sb-foot { border-top: 1px solid var(--border); padding: 12px 14px; font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.status-dot.on { background: var(--ok); }

/* main */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.topbar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px; flex-shrink: 0; }
.topbar .title { font-size: 14px; color: var(--text-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.scroll { flex: 1; overflow-y: auto; position: relative; }
.thread { max-width: 760px; margin: 0 auto; padding: 8px 16px 24px; }
.msg-user { display: flex; justify-content: flex-end; margin: 18px 0 10px; }
.msg-user .bubble { background: var(--user); border-radius: 16px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
.msg-user .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; justify-content: flex-end; }
.msg-user .umeta { margin-top: 4px; transition: opacity .15s; }
@media (hover: hover) { .msg-user .umeta { opacity: 0; } .msg-user:hover .umeta, .msg-user .umeta:focus-within { opacity: 1; } }
.msg-user .atts img { max-height: 120px; border-radius: 8px; border: 1px solid var(--border); }
.chip { font-size: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; background: var(--panel); color: var(--text-2); }
.msg-ai { margin: 6px 0 22px; font-family: var(--serif); font-size: 16.5px; line-height: 1.7; }
.msg-ai .md > *:first-child { margin-top: 0; }
.msg-ai .md p { margin: .6em 0; }
.msg-ai .md h1, .msg-ai .md h2, .msg-ai .md h3 { font-weight: 600; line-height: 1.3; margin: 1.1em 0 .5em; }
.msg-ai .md h1 { font-size: 1.4em; } .msg-ai .md h2 { font-size: 1.25em; } .msg-ai .md h3 { font-size: 1.1em; }
.msg-ai .md code { font-family: var(--mono); font-size: .85em; background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
.msg-ai .md pre { position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; }
.msg-ai .md pre code { border: 0; padding: 0; background: none; font-size: inherit; }
.msg-ai .md pre .copy { position: absolute; top: 6px; right: 6px; font-family: var(--sans); font-size: 12px; padding: 3px 8px; border-radius: 6px; color: var(--text-3); background: var(--panel); border: 1px solid var(--border); opacity: 0; }
.msg-ai .md pre:hover .copy { opacity: 1; }
.mmd { border: 1px solid var(--border); border-radius: 10px; margin: .8em 0; background: var(--panel); overflow: hidden; }
.mmd-bar { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-3); }
.mmd-bar span { flex: 1; }
.mmd-bar button { font-size: 12px; padding: 2px 8px; border-radius: 6px; color: var(--text-2); border: 1px solid var(--border); background: var(--bg); }
.mmd-view { overflow-x: auto; padding: 12px; text-align: center; }
.mmd-view:empty { display: none; }
.mmd-view svg { max-width: 100%; height: auto; }
.mmd-view:has(svg) { cursor: zoom-in; }
/* full-screen diagram viewer: wheel / pinch to zoom, drag to pan */
.mzv { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: flex; flex-direction: column; }
.mzv-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
.mzv-bar .t { flex: 1; font-size: 13px; color: var(--text-3); min-width: 120px; }
.mzv-bar button { font-size: 13px; min-width: 32px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); }
.mzv-bar .pct { font-size: 12px; color: var(--text-3); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.mzv-stage { flex: 1; overflow: hidden; position: relative; cursor: grab; touch-action: none; user-select: none; }
.mzv-stage.drag { cursor: grabbing; }
.mzv-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.mzv-inner svg { display: block; max-width: none !important; }
.mmd-wait { color: var(--text-3); font-size: 13px; padding: 10px; }
.mmd-err { font-size: 12.5px; color: var(--danger); padding: 8px 12px; line-height: 1.5; word-break: break-word; }
.mmd-acts { display: inline-flex; gap: 10px; margin-left: 8px; align-items: center; }
.mmd-acts button { font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); }
.mmd-acts a { font-size: 12px; color: var(--text-2); }
.msg-ai .md .mmd pre.mmd-code { margin: 0; border: 0; border-radius: 0; border-top: 1px solid var(--border); }
.msg-ai .md table { border-collapse: collapse; font-family: var(--sans); font-size: 14px; display: block; overflow-x: auto; }
.msg-ai .md th, .msg-ai .md td { border: 1px solid var(--border); padding: 6px 10px; }
.msg-ai .md blockquote { border-left: 3px solid var(--border-strong); margin: .6em 0; padding-left: 14px; color: var(--text-2); }
.msg-ai .md a { color: var(--accent); }
.msg-ai .md img { max-width: 100%; }
.thinking { font-family: var(--sans); font-size: 13px; color: var(--text-2); margin: 6px 0; }
.thinking summary { cursor: pointer; }
.thinking .body { white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 6px; }
/* image generation progress card */
.igp { font-family: var(--sans); border: 1px solid var(--border); border-radius: 12px; background: var(--panel); padding: 11px 14px; margin: 10px 0; max-width: 560px; }
.igp-head { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.igp-head svg { color: var(--accent); flex: none; }
.igp.err .igp-head svg { color: var(--danger); }
.igp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: igpPulse 1.1s ease-in-out infinite; margin-left: 2px; }
@keyframes igpPulse { 50% { opacity: .25; } }
.igp-bar { height: 5px; border-radius: 3px; background: var(--code-bg); overflow: hidden; margin: 9px 0 6px; }
.igp-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .9s ease; }
.igp.ok .igp-bar i { background: var(--ok); }
.igp.err .igp-bar i { background: var(--danger); }
.igp-meta { font-size: 12px; color: var(--text-3); }
.igp-err { font-size: 12.5px; color: var(--danger); margin-top: 6px; word-break: break-word; }
.igp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.igp-img { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); display: flex; flex-direction: column; animation: igpIn .35s ease; }
@keyframes igpIn { from { opacity: 0; transform: scale(.97); } }
.igp-img > a { display: block; aspect-ratio: 1; background: var(--code-bg); }
.igp-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.igp-acts { display: flex; border-top: 1px solid var(--border); background: var(--panel); }
.igp-acts a { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 4px; padding: 5px 0; font-size: 12px; color: var(--text-2); text-decoration: none; }
.igp-acts a + a { border-left: 1px solid var(--border); }
.igp-acts a:hover { background: var(--hover); color: var(--text); }
.igp-wait { aspect-ratio: 1; align-items: center; justify-content: center; color: var(--text-3); font-size: 12.5px;
  background: linear-gradient(100deg, var(--code-bg) 30%, color-mix(in srgb, var(--accent) 8%, var(--code-bg)) 50%, var(--code-bg) 70%) 0 0 / 300% 100%; animation: igpShimmer 1.6s linear infinite; }
@keyframes igpShimmer { to { background-position: -300% 0; } }
.igp:has(.igp-grid) { max-width: 680px; }
.igp-prompt { margin-top: 6px; font-size: 12.5px; color: var(--text-2); }
.igp-prompt summary { cursor: pointer; color: var(--text-3); }
.igp-prompt div { margin-top: 4px; white-space: pre-wrap; line-height: 1.5; }
.tool { font-family: var(--sans); font-size: 13.5px; border: 1px solid var(--border); border-radius: 10px; margin: 8px 0; background: var(--panel); overflow: hidden; }
.tool > summary { list-style: none; padding: 8px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; color: var(--text-2); }
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary .name { color: var(--text); font-weight: 500; }
.tool > summary .arg { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: var(--mono); font-size: 12.5px; }
.tool > summary .st { font-size: 12px; }
.tool .st.err { color: var(--danger); } .tool .st.ok { color: var(--ok); }
.tool pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; background: var(--code-bg); }
.err-block { font-family: var(--sans); font-size: 14px; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); background: color-mix(in srgb, var(--danger) 7%, transparent); border-radius: 10px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; }
.meta { font-family: var(--sans); font-size: 12px; color: var(--text-3); margin-top: 6px; display: flex; gap: 10px; align-items: center; }
.meta button { color: var(--text-3); padding: 2px 6px; border-radius: 6px; } .meta button:hover { background: var(--hover); color: var(--text); }
.spark { display: inline-block; width: 22px; height: 22px; color: var(--accent); animation: spin 2.4s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* permission */
.perm { border: 1px solid var(--accent); border-radius: 12px; background: var(--panel); padding: 12px 14px; margin: 10px 0; font-family: var(--sans); box-shadow: var(--shadow); }
.perm .h { font-weight: 600; margin-bottom: 6px; }
.perm pre { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; margin: 0 0 10px; }
.perm .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border-strong); font-size: 14px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }

/* empty state */
.hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 16px 12vh; }
.hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 5vw, 40px); margin: 0 0 28px; display: flex; align-items: center; gap: 12px; text-align: center; }
.hero h1 svg { width: 36px; height: 36px; color: var(--accent); flex-shrink: 0; }
.hero .composer-wrap { width: 100%; max-width: 680px; padding: 0; }

/* composer */
.composer-wrap { max-width: 760px; width: 100%; margin: 0 auto; padding: 0 16px 16px; position: relative; }
.composer { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 12px 12px 10px 16px; }
.composer:focus-within { border-color: var(--border-strong); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: inherit; font-size: 16px; line-height: 1.5; max-height: 40vh; min-height: 26px; }
.composer textarea::placeholder { color: var(--text-3); }
.c-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.c-row .sp { flex: 1; }
.pill { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 9px; font-size: 13.5px; color: var(--text-2); border: 1px solid transparent; white-space: nowrap; }
.pill:hover { background: var(--hover); color: var(--text); }
.pill.outlined { border-color: var(--border); }
.mode-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; padding: 2px; gap: 2px; }
.mode-toggle button { padding: 3px 10px; border-radius: 7px; font-size: 13px; color: var(--text-2); }
.mode-toggle button:hover { color: var(--text); }
.mode-toggle button.on { background: var(--hover); color: var(--text); font-weight: 500; }
.send { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.send:disabled { opacity: .4; cursor: default; }
.send.stop { background: var(--text); color: var(--bg); }
.att-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.att-list:empty { display: none; }
/* in-conversation index rail (left edge of the thread) */
.toc { position: absolute; left: 10px; top: 64px; bottom: 150px; width: 34px; display: flex; flex-direction: column; justify-content: center; z-index: 5; pointer-events: none; }
.toc-inner { display: flex; flex-direction: column; gap: 3px; max-height: 100%; overflow-y: auto; scrollbar-width: none; pointer-events: auto; padding: 4px 0; }
.toc-inner::-webkit-scrollbar { display: none; }
.toc-item { height: 14px; display: flex; align-items: center; cursor: pointer; padding-left: 4px; flex-shrink: 0; }
.toc-item i { display: block; height: 2px; width: 12px; border-radius: 2px; background: var(--border-strong); transition: width .15s, background .15s; }
.toc-item:hover i { width: 22px; background: var(--text-2); }
.toc-item.on i { width: 20px; background: var(--accent); }
.toc-item.br i { background: transparent; border-top: 2px dashed var(--border-strong); height: 0; }
.toc-tip { position: fixed; z-index: 45; width: 300px; max-width: calc(100vw - 70px); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.16); padding: 10px 12px; font-size: 13px; line-height: 1.5; pointer-events: none; }
.toc-tip .n { font-size: 11.5px; color: var(--text-3); margin-bottom: 4px; display: flex; gap: 8px; }
.toc-tip .q { font-weight: 600; color: var(--text); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.toc-tip .a { color: var(--text-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
@media (max-width: 1060px) { .toc { left: 2px; width: 26px; } .toc-item i { width: 9px; } }
@media (max-width: 700px) { .toc { display: none; } }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 14%, transparent); } to { background: transparent; } }
/* branches */
.branch-note { font-family: var(--sans); font-size: 12.5px; color: var(--text-3); display: flex; align-items: center; gap: 10px; margin: 14px 0; }
.branch-note::before, .branch-note::after { content: ''; flex: 1; border-top: 1px dashed var(--border-strong); }
.branch-note a { color: var(--accent); cursor: pointer; }
.branch-from { font-family: var(--sans); font-size: 12.5px; color: var(--text-3); margin: 4px 0 8px; }
.branch-from a { color: var(--accent); cursor: pointer; }
/* quote-reply (select text -> Reply, like claude.ai) */
.quote-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.quote-list:empty { display: none; }
.qcard { position: relative; display: flex; gap: 8px; align-items: flex-start; background: var(--hover); border-radius: 10px; padding: 7px 30px 7px 10px; font-size: 13px; color: var(--text-2); }
.qcard .qi { color: var(--text-3); flex-shrink: 0; line-height: 1.5; }
.qcard .qt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
.qcard .x { position: absolute; top: 4px; right: 6px; width: 20px; height: 20px; border-radius: 6px; color: var(--text-3); }
.qcard .x:hover { background: var(--border); color: var(--text); }
.msg-user .quotes { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; align-items: flex-end; max-width: 85%; }
.msg-user .uq { font-size: 13px; color: var(--text-2); border-left: 3px solid var(--border-strong); padding: 2px 0 2px 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; cursor: pointer; }
.msg-user .uq:hover { color: var(--text); border-left-color: var(--accent); }
::highlight(quote-src) { background-color: color-mix(in srgb, var(--accent) 28%, transparent); }

// ---------- drafts: unsent text, quotes and attachments are kept per conversation (and across reloads), like claude.ai ----------
const DRAFT_LS = 'relay_drafts';
const drafts = (() => { try { return JSON.parse(localStorage.getItem(DRAFT_LS)) || {}; } catch { return {}; } })();
const draftKey = () => state.current?.id || 'new';
let composerKey = null, draftTimer = 0;
function saveDraft() {
  const input = $('#input'); if (!input || composerKey === null) return;
  const d = { text: input.value, quotes: state.quotes.slice(), attachments: state.attachments.filter((a) => a.status !== 'error'), at: Date.now() };
  if (!d.text.trim() && !d.quotes.length && !d.attachments.length) delete drafts[composerKey]; else drafts[composerKey] = d;
  clearTimeout(draftTimer); draftTimer = setTimeout(persistDrafts, 300);
}
function persistDrafts() {
  const month = Date.now() - 30 * 864e5, out = {};
  for (const [k, d] of Object.entries(drafts)) {
    if (d.at < month) { delete drafts[k]; continue; }
    out[k] = { text: d.text, quotes: d.quotes, at: d.at,
      attachments: d.attachments.filter((a) => a.status === 'done' && a.id).map(({ id, name, type, size }) => ({ id, name, type, size })) };
  }
  try { localStorage.setItem(DRAFT_LS, JSON.stringify(out)); } catch {}
}
function loadDraft(key) {
  const d = drafts[key];

  state.attachments = d ? d.attachments.map((a) => (a.status ? a
    : { ...a, status: 'done', url: a.type?.startsWith('image/') ? `/api/files/${a.id}?k=${encodeURIComponent(KEY)}` : null })) : [];
  return d?.text || '';
}

// Like claude.ai: large photos are downscaled in the browser (long edge 2000 px) before upload.
async function shrinkImage(f) {
  if (!/^image\/(png|jpeg|webp)$/.test(f.type) || f.size < 1.5 * 1024 * 1024) return f;
  try {
    const bmp = await createImageBitmap(f);
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.88));
    return blob && blob.size < f.size ? new File([blob], f.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : f;
  } catch { return f; }
}
function uploadFile(a, file) {
  const xhr = new XMLHttpRequest();
  a.xhr = xhr;
  xhr.open('POST', '/api/upload');
  xhr.setRequestHeader('x-access-key', KEY);
  xhr.setRequestHeader('x-file-name', encodeURIComponent(file.name));
  xhr.setRequestHeader('content-type', file.type || 'application/octet-stream');
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) { a.progress = e.loaded / e.total; renderAtts(); } };
  xhr.onload = () => {
    if (xhr.status === 200) { Object.assign(a, JSON.parse(xhr.responseText), { status: 'done' }); }
    else { a.status = 'error'; }
    renderAtts(); renderComposerState();
  };
  xhr.onerror = () => { a.status = 'error'; renderAtts(); renderComposerState(); };
  xhr.send(file);
}
async function addFiles(files) {
  for (const orig of files) {
    if (orig.size > 50 * 1024 * 1024) { alert(`${orig.name} 超过 50MB`); continue; }
    const a = { name: orig.name, type: orig.type || 'application/octet-stream', size: orig.size, status: 'uploading', progress: 0,
      url: orig.type.startsWith('image/') ? URL.createObjectURL(orig) : null };
    state.attachments.push(a); renderAtts(); renderComposerState();
    const f = await shrinkImage(orig);
    a.name = f.name; a.type = f.type || a.type;
    uploadFile(a, f);
  }
}
function renderAtts() {

  const th = $('#thread'); if (!th || !state.current) return;
  const stick = scroll || nearBottom();
  const c = state.current;
  const from = SHARE ? `<div class="share-head">只读分享 · ${c.messages.filter((m) => m.role === 'user').length} 轮对话 · 快照时间 ${new Date(c.share.sharedAt).toLocaleString('zh-CN', { dateStyle: 'medium', timeStyle: 'short' })}</div>`
    : c.branchOf ? `<div class="branch-from">${BRANCH_ICON} 分支自 <a data-open="${esc(c.branchOf.convId)}">${esc(c.branchOf.title || '原对话')}</a></div>` : '';
  th.innerHTML = from + c.messages.map(msgHTML).join('');
  wireThread(th);
  if (stick) toBottom();
  renderToc(); renderFilesBtn();
  $('.topbar .title').textContent = state.current.title || '';
}
function renderLastTurn() {
  const th = $('#thread'); const last = th?.querySelector('.msg-ai:last-of-type'); if (!last) return renderThread();
  const stick = nearBottom();
  const open = new Set([...last.querySelectorAll('details[open]:not([data-live])')].map((d) => d.dataset.id || d.className));
  last.innerHTML = turnHTML(state.current.messages.at(-1));
  last.querySelectorAll('details').forEach((d) => { if (open.has(d.dataset.id || d.className)) d.open = true; });
  wireThread(last);
  if (stick) toBottom();
  if (state.current.messages.at(-1)?.done) { renderToc(); renderFilesBtn(); }
}
function renderPerms() {
  const el = $('#perms'); if (!el) return;
  const list = [...state.perms.values()].filter((p) => p.convId === state.current?.id);
  el.innerHTML = list.map((p) => `
    <div class="perm" data-r="${p.reqId}">
      <div class="h">Claude 请求使用 <code>${esc(p.toolName)}</code></div>
      <pre>${esc(typeof p.input === 'object' ? JSON.stringify(p.input, null, 2) : p.input)}</pre>
      <div class="btns"><button class="btn primary" data-a="allow">允许</button>${p.hasSuggestions ? '<button class="btn" data-a="always">本会话始终允许</button>' : ''}<button class="btn" data-a="deny">拒绝</button></div>
    </div>`).join('');
  el.querySelectorAll('.perm').forEach((card) => card.querySelectorAll('button').forEach((b) => (b.onclick = () => {
    const a = b.dataset.a; send({ type: 'perm', reqId: card.dataset.r, allow: a !== 'deny', always: a === 'always' });
    state.perms.delete(card.dataset.r); renderPerms();
  })));
  if (list.length) toBottom();
}

// ---------- boot ----------
render();
if (KEY && !SHARE) { loadMeta().then(renderComposerState).catch(() => {}); connect(); loadUsage(); setInterval(loadUsage, 5 * 60_000); }
</script>
</body>
</html>
